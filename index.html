<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sales Data Analytics</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<h1>Sales Data Analytics Dashboard</h1>

<div class="container">
    <div class="chart-box">
        <h2>Monthly Sales (Bar Chart)</h2>
        <canvas id="barChart"></canvas>
    </div>

    <div class="chart-box">
        <h2>Sales Distribution (Pie Chart)</h2>
        <canvas id="pieChart"></canvas>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
